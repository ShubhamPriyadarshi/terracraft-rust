[package]
name = "terraria_3d"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A 3D Terraria-like sandbox game built in Rust"

[dependencies]
bevy = { version = "0.15", features = ["jpeg"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

# Optional optimization features
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true

# Development profile
[profile.dev]
opt-level = 1
